<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiveM コマンド管理</title><link rel="stylesheet" href="./style.css"></head><body><header><h1>COMMAND ADMIN</h1><p>運営専用コマンド管理画面</p><a class="button secondary" href="./index.html">一般一覧へ戻る</a></header><main><section class="panel" id="loginPanel"><h2>管理者ログイン</h2><form id="loginForm"><label for="email">メールアドレス</label><input id="email" type="email" required autocomplete="username"><label for="password">パスワード</label><input id="password" type="password" required autocomplete="current-password"><p><button type="submit">ログイン</button></p></form></section><section class="hidden" id="adminPanel"><div class="panel row"><strong id="who"></strong><button class="secondary" id="logout">ログアウト</button></div><section class="panel"><h2 id="formTitle">コマンドを追加</h2><form id="commandForm"><label for="category">カテゴリ</label><select id="category"><option>一般</option><option>PD</option><option>EMS</option><option>犯罪系</option><option>Admin</option></select><label for="command">コマンド名</label><input id="command" placeholder="/jobmusic" maxlength="150" required><label for="description">用途</label><textarea id="description" placeholder="音楽再生範囲内の音楽を再生できる" maxlength="1000" required></textarea><p class="row"><button id="save" type="submit">保存する</button><button id="cancel" type="button" class="secondary">編集をキャンセル</button></p></form></section><section class="panel"><h2>登録済みコマンド</h2><input id="filter" placeholder="登録済みコマンドを検索"><div class="scroll"><table><thead><tr><th>カテゴリ</th><th>コマンド</th><th>用途</th><th>操作</th></tr></thead><tbody id="items"></tbody></table></div></section></section><p class="status" id="status" role="status"></p></main><script type="module" src="./admin.js"></script></body></html>
