<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiveM Command List</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><div><small>FIVEM SERVER GUIDE</small><h1>COMMAND LIST<span>.</span></h1><p>サーバー内で使用できるコマンド一覧</p></div><button id="loginBtn" class="secondary">運営ログイン</button></header><section class="toolbar"><nav id="categories" aria-label="カテゴリ"></nav><input id="search" type="search" placeholder="コマンド名・用途を検索"></section><section class="panel"><div class="tablewrap"><table><thead><tr><th>カテゴリ</th><th>コマンド名</th><th>用途</th><th id="actionHead" hidden>管理</th></tr></thead><tbody id="rows"></tbody></table></div><p id="status" role="status">読み込み中...</p></section><section id="adminPanel" class="panel" hidden><h2>運営管理</h2><p class="hint">登録内容は閲覧ページに反映されます。</p><form id="commandForm"><input type="hidden" id="editId"><label>カテゴリ<select id="formCategory" required><option>一般</option><option>PD</option><option>EMS</option><option>犯罪系</option><option>Admin</option></select></label><label>コマンド名<input id="formCommand" maxlength="120" placeholder="/jobmusic" required></label><label>用途<textarea id="formDescription" maxlength="1000" placeholder="コマンドの説明" required></textarea></label><div class="buttons"><button type="submit" id="saveBtn">コマンドを保存</button><button type="button" id="cancelBtn" class="secondary">編集をキャンセル</button></div></form></section><footer>FiveM Command Guide</footer></main><dialog id="loginDialog"><form id="loginForm" method="dialog"><h2>運営ログイン</h2><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="error" role="alert"></p><div class="buttons"><button type="submit">ログイン</button><button type="button" id="closeLogin" class="secondary">閉じる</button></div></form></dialog><script type="module" src="script.js"></script></body></html>
